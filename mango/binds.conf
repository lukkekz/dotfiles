# keybinds after keybinds after keybinds
bind=SUPER,Return,spawn,kitty
bind=SUPER,d,spawn_shell,dms ipc call spotlight toggle
bind=SUPER,v,spawn_shell,dms ipc call clipboard toggle
bind=SUPER,m,spawn_shell,dms ipc call processlist focusOrToggle
bind=SUPER,n,spawn_shell,dms ipc call notifications toggle
bind=SUPER,y,spawn_shell,dms ipc call dankdash wallpaper
bind=SUPER+CTRL,comma,spawn_shell,dms ipc call settings focusOrToggle
bind=SUPER,t,spawn,brave-origin
bind=SUPER+SHIFT,s,spawn,flatpak run com.valvesoftware.Steam
bind=SUPER+SHIFT,d,spawn,flatpak run com.discordapp.Discord
bind=SUPER+SHIFT,f,spawn,flatpak run com.spotify.Client
bind=SUPER,x,spawn,nautilus
bind=SUPER+SHIFT,q,killclient,
bind=SUPER+SHIFT,e,quit,
bind=SUPER+CTRL,l,spawn_shell,dms ipc call lock lock
bind=SUPER+CTRL,s,spawn_shell,dms ipc call lock lock; systemctl suspend
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+CTRL,f,togglefullscreen,
bind=SUPER,space,togglefloating,
bind=SUPER,o,toggleoverview,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER,Tab,switch_layout,
bind=SUPER+SHIFT,comma,focusmon,left
bind=SUPER+SHIFT,period,focusmon,right
bind=SUPER+ALT,comma,tagmon,left
bind=SUPER+ALT,period,tagmon,right
bind=NONE,XF86AudioMute,spawn_shell,dms ipc call audio mute
bind=NONE,XF86AudioLowerVolume,spawn_shell,dms ipc call audio decrement 3
bind=NONE,XF86AudioRaiseVolume,spawn_shell,dms ipc call audio increment 3
bind=NONE,XF86AudioMicMute,spawn_shell,dms ipc call audio micmute
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86MonBrightnessDown,spawn_shell,dms ipc call brightness decrement 5 ""
bind=NONE,XF86MonBrightnessUp,spawn_shell,dms ipc call brightness increment 5 ""
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=CTRL,Print,spawn_shell,grim - | wl-copy
bind=ALT,Print,spawn_shell,grim -g "$(slurp -w 0)" - | wl-copy
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
